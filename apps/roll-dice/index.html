<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161e19">
  <title>Roll Dice</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./dice-view.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <h1>Roll Dice</h1>
    <form id="dice" autocomplete="off">
      <fieldset aria-label="Tipo de dado">
        <div class="dice-types">
          <label><input type="radio" name="sides" value="4" required><span>D4</span></label>
          <label><input type="radio" name="sides" value="6"><span>D6</span></label>
          <label><input type="radio" name="sides" value="8"><span>D8</span></label>
          <label><input type="radio" name="sides" value="10"><span>D10</span></label>
          <label><input type="radio" name="sides" value="12"><span>D12</span></label>
          <label><input type="radio" name="sides" value="20" checked><span>D20</span></label>
          <label><input type="radio" name="sides" value="100"><span>D100</span></label>
        </div>
      </fieldset>
      <div class="roll-controls">
        <div class="stepper">
          <button id="remove-die" type="button" aria-label="Quitar un dado">−</button>
          <output id="quantity" for="remove-die add-die" aria-label="Número de dados">1</output>
          <button id="add-die" type="button" aria-label="Añadir un dado">+</button>
        </div>
        <button id="roll" type="submit">Lanzar</button>
      </div>
    </form>
    <output id="result" for="quantity"></output>
    <div id="tray" class="dice-tray" aria-hidden="true"></div>
  </main>
</body>
</html>
